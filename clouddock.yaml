application:
  name: whoisdg
  image: dgclasher/whoisdg:latest
  container_port: 5000

regions:
  - us-east-1

compute:
  type: ecs
  desired_count: 1
  cpu: 256
  memory: 512

database:
  enabled: false
  type: postgres

cache:
  enabled: false
  type: redis

environment_variables:
  RESUME_URL: https://gitlab.com/resume-url
